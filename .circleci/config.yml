version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.0
  shellcheck: circleci/shellcheck@3.1

filters: &filters
  tags:
    only: /.*/

jobs:
  test-scripts:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run: bash tests/utils_test.sh

workflows:
  lint-pack:
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          exclude: RC010
          filters: *filters
      - shellcheck/check:
          filters: *filters
      - test-scripts:
          filters: *filters
      - orb-tools/continue:
          orb_name: unity
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          requires: [orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check, test-scripts]
          filters: *filters
